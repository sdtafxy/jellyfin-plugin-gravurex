name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Validate metadata
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          yaml = pathlib.Path("build.yaml").read_text(encoding="utf-8")
          plugin = pathlib.Path("Jellyfin.Plugin.GravureX/Plugin.cs").read_text(encoding="utf-8")
          csproj = pathlib.Path("Jellyfin.Plugin.GravureX/Jellyfin.Plugin.GravureX.csproj").read_text(encoding="utf-8")

          guid = re.search(r'guid:\s*"([^"]+)"', yaml).group(1).lower()
          code_guid = re.search(r'Guid\.Parse\("([^"]+)"\)', plugin).group(1).lower()
          if guid != code_guid:
              sys.exit(f"guid mismatch: build.yaml has {guid}, Plugin.cs has {code_guid}")

          # The version is read from build.yaml at build time, so a literal one in
          # the project file means the two can drift apart again.
          for tag in ("AssemblyVersion", "FileVersion", "Version"):
              found = re.search(rf"<{tag}>([^<]*)</{tag}>", csproj)
              if found and "$(" not in found.group(1):
                  sys.exit(f"{tag} is hard coded as {found.group(1)}; it must come from build.yaml")

          print(f"metadata ok: {guid}")
          PY

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.GravureX/Jellyfin.Plugin.GravureX.csproj

      - name: Build
        run: >
          dotnet build Jellyfin.Plugin.GravureX/Jellyfin.Plugin.GravureX.csproj
          -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish Jellyfin.Plugin.GravureX/Jellyfin.Plugin.GravureX.csproj
          -c Release -o ./artifacts

      - name: Package
        run: |
          cd artifacts
          zip -j ../jellyfin-plugin-gravurex.zip \
            Jellyfin.Plugin.GravureX.dll \
            HtmlAgilityPack.dll \
            SixLabors.ImageSharp.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-gravurex
          path: jellyfin-plugin-gravurex.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jellyfin-plugin-gravurex.zip

      - name: Update plugin manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ZIP_NAME=jellyfin-plugin-gravurex.zip
          CHECKSUM=$(md5sum "$ZIP_NAME" | cut -d' ' -f1)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          python3 scripts/update_manifest.py \
            --source-url "$SOURCE_URL" \
            --checksum "$CHECKSUM" \
            --timestamp "$TIMESTAMP"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update plugin manifest for ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
